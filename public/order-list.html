<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notrox Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image/png" href="img/Notrox.png">
    <link rel="stylesheet" href="style/order-list.css">
    <script src="script/auth-check.js"></script>
</head>
<body>
<header>
    <a href="/" class="logo">NOTROX ADMIN</a>
    <nav>
        <button onclick="goToUser()">USER</button>
        <button onclick="goToListProd()">PRODUCTS</button>
        <button class="active">ORDERS</button>
        <button onclick="goToProductAdd()">ADD</button>
        <button onclick="logout()" style="color: #ff4d4d;">LOGOUT</button>
    </nav>
</header>
<div class="admin-container">
    <div class="order-list-header d-none d-lg-flex">
        <div class="col-id">ID</div>
        <div class="col-date">Dátum</div>
        <div class="col-price">Végösszeg</div>
        <div class="col-phase">Állapot</div>
        <div class="col-actions">Művelet</div>
    </div>
    <div id="orderListContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
    </div>
</div>
<script src="script/order-list.js"></script>
</body>
</html>
