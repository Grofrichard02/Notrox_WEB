<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script/auth-check.js"></script>
    <title>Notrox Admin</title>
    <link rel="icon" type="image/png" href="img/Notrox.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style/product-list.css">
</head>
<body>
<header>
    <a href="/" class="logo">NOTROX ADMIN</a>
    <nav>
        <button onclick="goToGetUsers()">USER</button>
        <button class="active">PRODUCTS</button>
        <button onclick="goToOrder()">ORDERS</button>
        <button onclick="goToProductAdd()">ADD</button>
        <button onclick="logout()" style="color: #ff4d4d;">LOGOUT</button>
    </nav>
</header>
<div class="container">
    <div class="search-container">
        <input type="text" id="pSearch" placeholder="Keresés..." oninput="filterProducts()">
    </div>
    <div id="productList">
        <p style="text-align: center; color: #8b949e;">Termékek betöltése...</p>
    </div>
</div>
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <h2 style="color: #ef4444; font-size: 20px; margin-top: 0;">Termék törlése</h2>
        <p style="font-size: 14px;">Biztosan törölni szeretnéd?</p>
        <p><strong id="deleteTargetName" style="color: white;"></strong></p>
        <div class="modal-btns">
            <button class="btn btn-cancel" onclick="closeModal()">Mégse</button>
            <button class="btn btn-delete" id="confirmDeleteBtn">Törlés</button>
        </div>
    </div>
</div>
<script src="script/product-list.js"></script>
</body>
</html>
